title: RDP Brute Force Attack
id: e8f3d2a1-0001-4444-beef-000000000001
status: experimental
description: >
  Detects multiple failed RDP authentication attempts within a short
  time window, indicating a potential brute force attack.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Your Name
date: 2024/01/01
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType: 10        # RemoteInteractive (RDP)
  timeframe: 5m
  condition: selection | count() by TargetUserName, IpAddress > 5
falsepositives:
  - Legitimate users with forgotten passwords
  - Automated scripts using wrong credentials
level: medium
