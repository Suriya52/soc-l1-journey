title: PowerShell Download Cradle
id: e8f3d2a1-0002-4444-beef-000000000002
status: experimental
description: >
  Detects PowerShell commands used to download and execute content from
  the internet, a common technique used by attackers.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Your Name
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadFile'
      - 'DownloadString'
      - 'WebClient'
      - 'Invoke-WebRequest'
      - 'IEX'
      - 'Invoke-Expression'
      - 'curl'
      - 'wget'
  condition: selection
falsepositives:
  - Legitimate admin scripts downloading updates
  - Software deployment via PowerShell
level: high
